name: Build .NET 10 MAUI Mac PKG

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Install MAUI workload
        run: sudo dotnet workload install maui

      - name: Restore project
        run: dotnet restore

      - name: Publish Mac Catalyst PKG
        run: |
          dotnet publish NotesApp\NotesApp.csproj \
            -f net10.0-maccatalyst \
            -c Release

      - name: Find PKG
        run: |
          echo "Generated packages:"
          find . -name "*.pkg"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: Mac-PKG
          path: |
            **/bin/Release/net10.0-maccatalyst/**/publish/*.pkg
            **/bin/Release/net10.0-maccatalyst/publish/*.pkg
          if-no-files-found: error
